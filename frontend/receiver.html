<!DOCTYPE html>
<html>
<head>

    <title>Emergency Contact</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .alert-box {
            width: 350px;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid #d32f2f;
            border-radius: 10px;
            text-align: left;
            display: none;
        }

        .alert-box h2 {
            text-align: center;
        }

        .info {
            margin: 10px 0;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<h1>Emergency Contact</h1>

<h2 id="status">
    Waiting for emergency call...
</h2>


<!-- Emergency information -->

<div id="alertBox" class="alert-box">

    <h2>🚨 EMERGENCY ALERT</h2>

    <div class="info">
        <strong>Patient:</strong>
        <span id="patientName">-</span>
    </div>

    <div class="info">
        <strong>User ID:</strong>
        <span id="patientId">-</span>
    </div>

    <div class="info">
        <strong>Location:</strong>
        <span id="patientLocation">-</span>
    </div>

    <div class="info">
        <strong>Language:</strong>
        <span id="patientLanguage">-</span>
    </div>

</div>


<button onclick="answerCall()">
    ANSWER
</button>


<audio id="remoteAudio" autoplay></audio>


<script>

const ws = new WebSocket(
    "ws://" + window.location.host + "/ws"
);

let peerConnection;
let incomingOffer = null;


/*
============================================================
WEBSOCKET MESSAGE HANDLER
============================================================
*/

ws.onmessage = async (event) => {

    const message = JSON.parse(event.data);


    /*
    --------------------------------------------------------
    FALL DETECTED
    --------------------------------------------------------
    */

    if (message.type === "fall_detected") {

        console.log(
            "🚨 FALL ALERT RECEIVED"
        );

        console.log(
            "Patient:",
            message.name
        );

        console.log(
            "Location:",
            message.location
        );


        // Show emergency information

        document.getElementById(
            "alertBox"
        ).style.display = "block";


        document.getElementById(
            "patientName"
        ).innerText = message.name;


        document.getElementById(
            "patientId"
        ).innerText = message.user_id;


        document.getElementById(
            "patientLocation"
        ).innerText = message.location;


        document.getElementById(
            "patientLanguage"
        ).innerText = message.language;


        document.getElementById(
            "status"
        ).innerText =
            "🚨 INCOMING EMERGENCY CALL";

    }


    /*
    --------------------------------------------------------
    INCOMING WEBRTC OFFER
    --------------------------------------------------------
    */

    if (message.type === "offer") {

        incomingOffer = message.offer;

        document.getElementById(
            "status"
        ).innerText =
            "🚨 INCOMING EMERGENCY CALL";

    }


    /*
    --------------------------------------------------------
    ICE CANDIDATE
    --------------------------------------------------------
    */

    if (message.type === "candidate") {

        if (peerConnection) {

            await peerConnection.addIceCandidate(
                message.candidate
            );

        }

    }

};


/*
============================================================
ANSWER EMERGENCY CALL
============================================================
*/

async function answerCall() {

    peerConnection =
        new RTCPeerConnection();


    /*
    --------------------------------------------------------
    SEND ICE CANDIDATES
    --------------------------------------------------------
    */

    peerConnection.onicecandidate =
        (event) => {

            if (event.candidate) {

                ws.send(
                    JSON.stringify({

                        type: "candidate",

                        candidate:
                            event.candidate

                    })
                );

            }

        };


    /*
    --------------------------------------------------------
    RECEIVE EMERGENCY AUDIO
    --------------------------------------------------------
    */

    peerConnection.ontrack =
        (event) => {

            document.getElementById(
                "remoteAudio"
            ).srcObject =
                event.streams[0];

        };


    /*
    --------------------------------------------------------
    SET CALL OFFER
    --------------------------------------------------------
    */

    await peerConnection.setRemoteDescription(

        new RTCSessionDescription(
            incomingOffer
        )

    );


    /*
    --------------------------------------------------------
    CREATE ANSWER
    --------------------------------------------------------
    */

    const answer =
        await peerConnection.createAnswer();


    await peerConnection.setLocalDescription(
        answer
    );


    /*
    --------------------------------------------------------
    SEND ANSWER BACK TO CALLER
    --------------------------------------------------------
    */

    ws.send(

        JSON.stringify({

            type: "answer",

            answer: answer

        })

    );


    /*
    --------------------------------------------------------
    UPDATE STATUS
    --------------------------------------------------------
    */

    document.getElementById(
        "status"
    ).innerText =
        "📞 CONNECTED TO EMERGENCY CALL";

}

</script>

</body>
</html>
